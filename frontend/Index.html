<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="container">
            <div class="header">
                <span class="logo">Control</span>
                <div class="header-right">
                    <span id="connectionStatus" class="status-dot offline"></span>
                    <button id="logoutBtn" class="btn logout-btn">Exit</button>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-label">Registered</span>
                    <span class="stat-value" id="totalUsers">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Connected</span>
                    <span class="stat-value" id="activeUsers">0</span>
                </div>
            </div>

            <div class="toolbar">
                <button id="addUserBtn" class="btn btn-add">Add User</button>
                <button id="refreshBtn" class="btn btn-refresh">Refresh</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>HWID</th>
                            <th>Status</th>
                            <th>Lag</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr><td colspan="5" class="empty-state">No users registered</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Add User Modal -->
        <div id="addUserModal" class="modal">
            <div class="modal-box">
                <div class="modal-header">
                    <span>Add User</span>
                    <span class="modal-close">&times;</span>
                </div>
                <form id="addUserForm">
                    <input type="text" id="hwidInput" placeholder="HWID" required>
                    <input type="text" id="usernameInput" placeholder="Username (optional)">
                    <button type="submit" class="btn btn-add">Add User</button>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
