<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Crasher Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ Roblox Crasher Manager</h1>
            <div class="login-status">
                <span id="statusText">Not Authenticated</span>
                <button id="loginBtn" class="btn btn-primary">Login</button>
            </div>
        </div>

        <!-- Login Modal -->
        <div id="loginModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Owner Login</h2>
                <form id="loginForm">
                    <input type="password" id="passwordInput" placeholder="Enter owner password" required>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
            </div>
        </div>

        <!-- Add User Modal -->
        <div id="addUserModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Add New User</h2>
                <form id="addUserForm">
                    <input type="text" id="hwidInput" placeholder="HWID" required>
                    <input type="text" id="usernameInput" placeholder="Username (optional)">
                    <button type="submit" class="btn btn-success">Add User</button>
                </form>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-card">
                <h3>Total Users</h3>
                <span id="totalUsers">0</span>
            </div>
            <div class="stat-card">
                <h3>Active Users</h3>
                <span id="activeUsers">0</span>
            </div>
        </div>

        <!-- Actions -->
        <div class="actions">
            <button id="addUserBtn" class="btn btn-success">+ Add User</button>
            <button id="refreshBtn" class="btn btn-primary">🔄 Refresh</button>
        </div>

        <!-- User Table -->
        <div class="user-table-wrapper">
            <table id="userTable">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>HWID</th>
                        <th>Status</th>
                        <th>Lag %</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr>
                        <td colspan="5" class="no-data">Loading users...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
