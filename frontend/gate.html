<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Required</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gate {
            width: 340px;
            padding: 40px;
            background: #111;
            border: 1px solid #1a1a1a;
            border-radius: 6px;
        }
        .gate h1 {
            font-weight: 300;
            font-size: 24px;
            color: #e0e0e0;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }
        .gate p {
            color: #444;
            font-size: 13px;
            margin-bottom: 28px;
        }
        .gate input {
            width: 100%;
            padding: 12px 16px;
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            color: #e0e0e0;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            margin-bottom: 12px;
        }
        .gate input:focus { border-color: #2a2a2a; }
        .gate button {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: none;
            color: #e0e0e0;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .gate button:hover { background: #252525; }
        .gate-error {
            color: #ff3b3b;
            font-size: 13px;
            margin-top: 12px;
            min-height: 20px;
        }
        .loading {
            color: #666;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="gate" id="gateBox">
        <h1>Access</h1>
        <p>Enter password to continue</p>
        <form id="gateForm">
            <input type="password" id="gatePassword" placeholder="Password" autofocus>
            <button type="submit" id="unlockBtn">Unlock</button>
        </form>
        <div id="gateError" class="gate-error"></div>
        <div id="loadingText" class="loading" style="display:none;">Loading...</div>
    </div>

    <script>
        // Check if already logged in
        if (document.cookie.includes('siteSession=')) {
            window.location.href = '/index.html';
        }

        document.getElementById('gateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('gatePassword').value;
            const errorEl = document.getElementById('gateError');
            const loadingEl = document.getElementById('loadingText');
            const submitBtn = document.getElementById('unlockBtn');
            
            if (!password) {
                errorEl.textContent = 'Please enter password';
                return;
            }
            
            errorEl.textContent = '';
            loadingEl.style.display = 'block';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Checking...';
            
            try {
                const response = await fetch('/api/site-auth', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Set cookie and redirect
                    document.cookie = `siteSession=${data.token}; path=/; max-age=3600`;
                    loadingEl.textContent = 'Access granted! Redirecting...';
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 500);
                } else {
                    errorEl.textContent = 'Invalid password';
                    document.getElementById('gatePassword').value = '';
                    document.getElementById('gatePassword').focus();
                    loadingEl.style.display = 'none';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Unlock';
                }
            } catch (err) {
                errorEl.textContent = 'Connection error. Try again.';
                loadingEl.style.display = 'none';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Unlock';
            }
        });
    </script>
</body>
</html>
